<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What I’ve Been Thinking About</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<!-- BODY START -->
<div class="wrap">
  <header class="top">
    <h1>What I’ve Been Thinking About</h1>
    <input class="search" id="search" type="search" placeholder="Search" aria-label="Search clippings">
  </header>
  <section class="feature" id="feature" hidden aria-label="Featured clipping"></section>
  <main class="wall" id="wall"></main>
  <p class="empty" id="empty" hidden>Nothing matches that search.</p>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Clipping">
  <div class="sheet">
    <div class="media"></div>
    <div class="info"></div>
  </div>
  <button class="vbtn vclose" type="button" aria-label="Close">×</button>
  <button class="vbtn nav vprev" type="button" aria-label="Previous">‹</button>
  <button class="vbtn nav vnext" type="button" aria-label="Next">›</button>
</div>
<!-- BODY END -->
<script src="app.js?v=7"></script>
</body>
</html>
